name: Build iOS Simulator App for Appetize

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS Simulator on macOS Runner
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS Simulator App
        run: flutter build ios --simulator

      - name: Compress App Bundle for Appetize
        run: |
          cd build/ios/iphonesimulator
          zip -r ../../../arcist-ios-simulator.zip Runner.app

      - name: Upload Simulator Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-zip
          path: arcist-ios-simulator.zip