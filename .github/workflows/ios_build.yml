name: Build iOS Simulator App for Appetize

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS Simulator on macOS Runner
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Flutter Pub Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            **/.dart_tool
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-pub-

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS Simulator App
        run: flutter build ios --simulator --no-codesign

      - name: Compress App Bundle for Appetize
        run: |
          # Navigate to the specific simulator build directory
          cd build/ios/iphonesimulator
          
          if [ ! -d "Runner.app" ]; then
            echo "Error: Runner.app not found in build/ios/iphonesimulator!"
            exit 1
          fi
          
          zip -r "$GITHUB_WORKSPACE/arcist-ios-simulator.zip" Runner.app

      - name: Upload Simulator Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-zip
          path: arcist-ios-simulator.zip
          retention-days: 7
